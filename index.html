<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poetry Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#eee;font-family:Arial,sans-serif}
header{text-align:center;padding:28px 12px;background:#080808;border-bottom:2px solid #c9a33b}
header h1{color:#d7b44a;margin:0;font-size:34px}
header p{color:#ccc}
nav{text-align:center;padding:15px}
button{background:#c9a33b;color:#111;border:0;padding:10px 16px;margin:5px;border-radius:6px;cursor:pointer;font-weight:bold}
button:hover{background:#f0d477}
input,select{padding:11px;margin:7px 0;width:100%;border:1px solid #c9a33b;border-radius:5px;background:#222;color:white}
.container{max-width:1050px;margin:auto;padding:15px}
.panel{background:#1c1c1c;border:1px solid #9e7c2c;border-radius:10px;padding:18px;margin:15px 0}
h2{color:#d7b44a}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:#202020;border:1px solid #806525;border-radius:9px;padding:10px}
.card img{width:100%;height:240px;object-fit:cover;border-radius:6px}
.card p{color:#ddd;overflow-wrap:anywhere}
.hidden{display:none!important}
#message{padding:10px;color:#f0d477}
footer{text-align:center;padding:25px;color:#aaa}
</style>
</head>
<body>

<header>
<h1>Poetry Hub</h1>
<p>Words That Touch The Heart</p>
</header>

<nav>
<button onclick="showCategory('all')">Home</button>
<button onclick="showCategory('sad')">Sad Poetry</button>
<button onclick="showCategory('love')">Love Poetry</button>
<button onclick="showCategory('islamic')">Islamic Poetry</button>
</nav>

<div class="container">
<div class="panel">
<h2>Welcome to Poetry Hub</h2>
<p>Explore beautiful Urdu poetry in different categories.</p>
</div>

<div class="panel">
<h2>Admin Login</h2>
<div id="loginBox">
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Admin Password">
<button onclick="login()">Login</button>
</div>
<div id="adminBox" class="hidden">
<p>Admin Panel میں خوش آمدید۔</p>
<select id="category">
<option value="sad">Sad Poetry</option>
<option value="love">Love Poetry</option>
<option value="islamic">Islamic Poetry</option>
</select>
<input id="imageFile" type="file" accept="image/*">
<input id="caption" type="text" placeholder="Poetry Caption (اختیاری)">
<button onclick="uploadImage()">Upload Image</button>
<button onclick="logout()">Logout</button>
</div>
<div id="message"></div>
</div>

<h2 id="galleryTitle">All Poetry</h2>
<div id="gallery" class="gallery"></div>
</div>

<footer>© 2026 Poetry Hub</footer>

<script>
const SUPABASE_URL = https://cpercqgnnipatehzflez.supabase.co
const SUPABASE_KEY = "sb_publishable_-VlXeoY_jruqCIDV3zT9EQ_rY4Gtvqw";
const ADMIN_UID = "04ac9f6c-6b5c-4c4e-a5ac-0674a506ba94";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let selectedCategory = "all";

function message(text) {
  document.getElementById("message").textContent = text;
}

function updateAdminPanel() {
  const isAdmin = currentUser && currentUser.id === ADMIN_UID;
  document.getElementById("loginBox").classList.toggle("hidden", !!isAdmin);
  document.getElementById("adminBox").classList.toggle("hidden", !isAdmin);
}

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    message("براہ کرم Email اور Password درج کریں۔");
    return;
  }

  message("Login ہو رہا ہے...");
  const { data, error } = await db.auth.signInWithPassword({
    email, password
  });

  if (error) {
    message("Login نہیں ہو سکا: " + error.message);
    return;
  }

  if (data.user.id !== ADMIN_UID) {
    await db.auth.signOut();
    currentUser = null;
    updateAdminPanel();
    message("یہ اکاؤنٹ Admin نہیں ہے۔");
    return;
  }

  currentUser = data.user;
  updateAdminPanel();
  message("Admin Login کامیاب ہوگیا۔");
}

async function logout() {
  await db.auth.signOut();
  currentUser = null;
  updateAdminPanel();
  message("آپ Logout ہوگئے ہیں۔");
}

function showCategory(category) {
  selectedCategory = category;
  document.getElementById("galleryTitle").textContent =
    category === "all" ? "All Poetry" :
    category === "sad" ? "Sad Poetry" :
    category === "love" ? "Love Poetry" : "Islamic Poetry";
  loadImages();
}

async function loadImages() {
  const gallery = document.getElementById("gallery");
  gallery.replaceChildren();

  let request = db.from("poetry_images").select("*")
    .order("created_at", { ascending: false });

  if (selectedCategory !== "all") {
    request = request.eq("category", selectedCategory);
  }

  const { data, error } = await request;

  if (error) {
    message("تصاویر لوڈ نہیں ہو سکیں: " + error.message);
    return;
  }

  if (!data || data.length === 0) {
    gallery.textContent = "ابھی اس کیٹیگری میں کوئی تصویر موجود نہیں۔";
    return;
  }

  data.forEach(item => {
    const { data: imageData } = db.storage
      .from("poetry-images")
      .getPublicUrl(item.image_path);

    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.src = imageData.publicUrl;
    img.alt = "Poetry Image";
    img.loading = "lazy";
    card.appendChild(img);

    const caption = document.createElement("p");
    caption.textContent = item.caption || "";
    card.appendChild(caption);

    const share = document.createElement("button");
    share.textContent = "Share Image";
    share.onclick = () => shareImage(imageData.publicUrl);
    card.appendChild(share);

    if (currentUser && currentUser.id === ADMIN_UID) {
      const del = document.createElement("button");
      del.textContent = "Delete";
      del.onclick = () => deleteImage(item);
      card.appendChild(del);
    }

    gallery.appendChild(card);
  });
}

async function uploadImage() {
  if (!currentUser || currentUser.id !== ADMIN_UID) {
    message("صرف Admin تصویر اپلوڈ کر سکتا ہے۔");
    return;
  }

  const file = document.getElementById("imageFile").files[0];
  const category = document.getElementById("category").value;
  const caption = document.getElementById("caption").value.trim();

  if (!file) {
    message("پہلے تصویر منتخب کریں۔");
    return;
  }

  if (!file.type.startsWith("image/")) {
    message("صرف Image فائل منتخب کریں۔");
    return;
  }

  if (file.size > 50 * 1024 * 1024) {
    message("تصویر 50MB سے چھوٹی ہونی چاہیے۔");
    return;
  }

  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
  const path = category + "/" + Date.now() + "-" + safeName;

  message("تصویر اپلوڈ ہو رہی ہے...");

  const { error: uploadError } = await db.storage
    .from("poetry-images")
    .upload(path, file);

  if (uploadError) {
    message("Upload Error: " + uploadError.message);
    return;
  }

  const { error: insertError } = await db
    .from("poetry_images")
    .insert({
      category: category,
      image_path: path,
      caption: caption
    });

  if (insertError) {
    await db.storage.from("poetry-images").remove([path]);
    message("تصویر کی تفصیل محفوظ نہیں ہوئی: " + insertError.message);
    return;
  }

  document.getElementById("imageFile").value = "";
  document.getElementById("caption").value = "";
  message("تصویر کامیابی سے اپلوڈ ہوگئی۔");
  showCategory(category);
}

async function deleteImage(item) {
  if (!currentUser || currentUser.id !== ADMIN_UID) {
    message("صرف Admin تصویر ڈیلیٹ کر سکتا ہے۔");
    return;
  }

  if (!confirm("کیا آپ واقعی یہ تصویر ڈیلیٹ کرنا چاہتے ہیں؟")) return;

  const { error: rowError } = await db
    .from("poetry_images")
    .delete()
    .eq("id", item.id);

  if (rowError) {
    message("Delete Error: " + rowError.message);
    return;
  }

  const { error: fileError } = await db.storage
    .from("poetry-images")
    .remove([item.image_path]);

  if (fileError) {
    message("ریکارڈ ڈیلیٹ ہوگیا، مگر Storage فائل نہیں ہٹی: " + fileError.message);
  } else {
    message("تصویر ڈیلیٹ ہوگئی۔");
  }

  loadImages();
}

async function shareImage(url) {
  try {
    if (navigator.share) {
      await navigator.share({
        title: "Poetry Hub",
        text: "Poetry Hub پر یہ تصویر دیکھیں",
        url: url
      });
    } else if (navigator.clipboard) {
      await navigator.clipboard.writeText(url);
      message("تصویر کا لنک Copy ہوگیا۔");
    } else {
      message("اس براؤزر میں Share دستیاب نہیں۔");
    }
  } catch (error) {
    if (error.name !== "AbortError") {
      message("Share نہیں ہو سکا۔");
    }
  }
}

async function startWebsite() {
  const { data } = await db.auth.getSession();
  currentUser = data.session ? data.session.user : null;

  if (currentUser && currentUser.id !== ADMIN_UID) {
    await db.auth.signOut();
    currentUser = null;
  }

  updateAdminPanel();
  loadImages();

  db.auth.onAuthStateChange((_event, session) => {
    currentUser = session ? session.user : null;
    if (currentUser && currentUser.id !== ADMIN_UID) {
      currentUser = null;
      db.auth.signOut();
    }
    updateAdminPanel();
    loadImages();
  });
}

startWebsite();
</script>
</body>
</html>
